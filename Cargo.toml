[package]
name = "video_toolset"
version = "0.1.0"
edition = "2021"
description = "Scene detection tool for MPEG video files using OpenCV"
authors = ["Your Name"]

[features]
default = ["cli"]
cli = ["clap"]
gui = ["tauri", "tauri-build"]

[dependencies]
# Video Processing
opencv = { version = "0.92", features = ["videoio", "imgproc"] }

# CLI
clap = { version = "4.5", features = ["derive"], optional = true }

# GUI (Tauri)
tauri = { version = "2.0", features = [], optional = true }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

[build-dependencies]
tauri-build = { version = "2.0", features = [], optional = true }

# Optimized release build
[profile.release]
lto = true
codegen-units = 1
